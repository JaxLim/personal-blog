# Builds the site and publishes it to GitHub Pages.
#
# Runs on every push to main, every six hours (so the static pages carry
# fresh GitHub data for new visitors; open pages update themselves), and on
# demand from the Actions tab.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Optional: add a secret GH_PROFILE_TOKEN (a fine-grained token with no extra
# permissions) if the contribution calendar can't be read with the default token.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Where the site is served from, e.g. https://jaxlim.github.io + /personal-blog
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GH_PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
